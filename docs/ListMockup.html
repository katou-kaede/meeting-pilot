<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MeetingPilot</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-50">

<div class="max-w-7xl mx-auto p-8">

    <!-- Header -->

    <div class="flex justify-between items-center mb-8">

        <div>
            <h1 class="text-3xl font-bold text-slate-900">
                MeetingPilot
            </h1>

            <p class="text-slate-500 mt-1">
                会議一覧
            </p>
        </div>

        <button
            class="bg-slate-900 text-white px-5 py-3 rounded-xl hover:bg-slate-800"
        >
            ＋ 新規会議
        </button>

    </div>

    <!-- Search -->

    <div
        class="bg-white border border-slate-200 rounded-2xl p-4 mb-6"
    >

        <div class="flex gap-4">

            <input
                type="text"
                placeholder="会議名・会議相手で検索"
                class="flex-1 border border-slate-300 rounded-xl px-4 py-2"
            >

            <select
                class="border border-slate-300 rounded-xl px-4 py-2"
            >
                <option>すべて</option>
                <option>予定</option>
                <option>進行中</option>
                <option>完了</option>
            </select>

        </div>

    </div>

    <!-- Table -->

    <div
        class="bg-white border border-slate-200 rounded-2xl overflow-hidden"
    >

        <table class="w-full">

            <thead
                class="bg-slate-50 border-b border-slate-200"
            >

            <tr class="text-left">

                <th class="px-6 py-4 text-sm font-semibold text-slate-600">
                    会議名
                </th>

                <th class="px-6 py-4 text-sm font-semibold text-slate-600">
                    会議相手
                </th>

                <th class="px-6 py-4 text-sm font-semibold text-slate-600">
                    開始日時
                </th>

                <th class="px-6 py-4 text-sm font-semibold text-slate-600">
                    時間
                </th>

                <th class="px-6 py-4 text-sm font-semibold text-slate-600">
                    状態
                </th>

            </tr>

            </thead>

            <tbody>

            <tr
                class="border-b border-slate-100 hover:bg-slate-50 cursor-pointer"
            >
                <td class="px-6 py-4 font-medium">
                    要件定義ミーティング
                </td>

                <td class="px-6 py-4 text-slate-600">
                    株式会社サンプル
                </td>

                <td class="px-6 py-4 text-slate-600">
                    2026/08/20 13:00
                </td>

                <td class="px-6 py-4 text-slate-600">
                    60分
                </td>

                <td class="px-6 py-4">
                    <span
                        class="px-3 py-1 rounded-full bg-slate-100 text-slate-700 text-sm"
                    >
                        予定
                    </span>
                </td>
            </tr>

            <tr
                class="border-b border-slate-100 hover:bg-slate-50 cursor-pointer"
            >
                <td class="px-6 py-4 font-medium">
                    週次開発定例
                </td>

                <td class="px-6 py-4 text-slate-600">
                    開発チーム
                </td>

                <td class="px-6 py-4 text-slate-600">
                    2026/08/18 10:00
                </td>

                <td class="px-6 py-4 text-slate-600">
                    90分
                </td>

                <td class="px-6 py-4">
                    <span
                        class="px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-sm"
                    >
                        進行中
                    </span>
                </td>
            </tr>

            <tr
                class="hover:bg-slate-50 cursor-pointer"
            >
                <td class="px-6 py-4 font-medium">
                    月次振り返り
                </td>

                <td class="px-6 py-4 text-slate-600">
                    営業部
                </td>

                <td class="px-6 py-4 text-slate-600">
                    2026/08/10 15:00
                </td>

                <td class="px-6 py-4 text-slate-600">
                    45分
                </td>

                <td class="px-6 py-4">
                    <span
                        class="px-3 py-1 rounded-full bg-green-100 text-green-700 text-sm"
                    >
                        完了
                    </span>
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
